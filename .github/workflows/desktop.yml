name: Desktop packages
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Market-Intelligence-AI-Windows-x64
          - os: ubuntu-24.04
            artifact: Market-Intelligence-AI-Linux-x64
    runs-on: ${{ matrix.os }}
    env:
      MARKET_NEWS_FEEDS: ""
      MARKET_CALENDAR_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgbm1 libnss3 libasound2t64 libxcb-cursor0 libxkbcommon-x11-0 libxkbfile1 libopengl0 libxcomposite1 libxdamage1 libxrandr2 libxtst6
      - run: uv sync --locked --group desktop
      - run: uv run --locked --group desktop pyinstaller --noconfirm --windowed --name MarketIntelligenceAI --collect-data tzdata --add-data frontend/dist:frontend/dist desktop.py
      - if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: |
          timeout 45s dist/MarketIntelligenceAI/MarketIntelligenceAI --smoke-test
          tar -czf Market-Intelligence-AI-Linux-x64.tar.gz -C dist MarketIntelligenceAI
      - if: runner.os == 'Windows'
        name: Smoke test Windows package
        timeout-minutes: 2
        env:
          QT_QPA_PLATFORM: offscreen
          QT_OPENGL: software
        run: |
          $process = Start-Process -FilePath "dist/MarketIntelligenceAI/MarketIntelligenceAI.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(45000)) {
            $process.Kill()
            throw "Desktop smoke test exceeded 45 seconds"
          }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - if: runner.os == 'Windows'
        run: tar.exe -a -cf Market-Intelligence-AI-Windows-x64.zip -C dist MarketIntelligenceAI
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
          if-no-files-found: error
