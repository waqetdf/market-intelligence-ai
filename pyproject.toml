[project]
name = "market-intelligence-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "defusedxml>=0.7,<1"]

[dependency-groups]
desktop = [
    "pyinstaller>=6.13,<7",
    "pyside6>=6.8,<7",
    "python-dotenv>=1,<2",
]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
